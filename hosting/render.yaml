# render.yaml — Render Blueprint for the production environment.
#
# Phase 4 wheel #3 (hosting decision). Describes the FastAPI Web Service, the
# managed Postgres database, and (Session 40) the PWA Static Site that back
# The Remnant of Promise Official Study Bible. When this file is in a Git
# repo connected to a Render Blueprint, "New → Blueprint" in the Render
# dashboard provisions all three, wires DATABASE_URL automatically from the
# Postgres service into the web service's env, and stands the stack up.
#
# Custom domains added in the Render dashboard AFTER first deploy succeeds —
# Render then provisions Let's Encrypt certs automatically:
#
#   remnant-app-api  → api.bible.remnantofpromise.org   (Session 40 — moved
#                       here from bible.remnantofpromise.org so the PWA can
#                       claim the bare subdomain. Yoshi: remove the old
#                       custom domain in the dashboard before adding the new
#                       one; certs stay valid through the swap.)
#   remnant-app-pwa  → bible.remnantofpromise.org       (Session 40 — new)
#
# That hostname split is Phase 4 wheel #4-revised. Domain layout chosen
# (Session 40 open): api on the api.bible subdomain, PWA on the bare
# bible. subdomain. Cleaner separation, simpler Render config than
# single-origin path routing.
#
# Schema and seed data are NOT bundled. After first deploy, run from operator
# laptop (one-time):
#     cd ~/Desktop/App/api
#     DATABASE_URL=<render-postgres-external-url> python seed.py --bootstrap
# That drops `public`, applies ../data-schema/schema.sql, and seeds the four parsed
# Restored Names JSONs (4 editions / 17 books / 436 chapters / 12,019 verses).
#
# Reseed flow (when extras republish): same command with `--seed-only` instead of
# `--bootstrap`. Cascade-deletes the four extras editions and reloads. User data
# (study notes, subscriptions, founder pricing counter, reading positions) is
# untouched.

databases:
  - name: remnant-app-db
    databaseName: remnant_app
    user: remnant_app
    plan: basic-256mb
    region: oregon
    postgresMajorVersion: "16"
    # ipAllowList intentionally empty — only the linked Render web service connects.
    # Operator laptop seed runs use the external connection string with TLS, on demand,
    # not via persistent allow-list.
    ipAllowList: []

services:
  - type: web
    name: remnant-app-api
    runtime: docker
    plan: starter
    region: oregon
    # rootDir is the repo root (default) so the Dockerfile can reach api/,
    # data-schema/, and source-texts/parsed/ in a single build context.
    # Session 12 restructure: the original `rootDir: api` design assumed
    # schema + parsed JSONs would arrive via operator-laptop seed against
    # the external Postgres URL, but Render's external Postgres requires
    # explicit IP allowlist entries — running seed.py from inside the
    # Render Shell against the internal hostname is cleaner, which means
    # schema.sql and the parsed JSONs need to live inside the image.
    dockerfilePath: ./api/Dockerfile
    autoDeploy: true
    healthCheckPath: /v1/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: remnant-app-db
          property: connectionString
      - key: CORS_ORIGINS
        # Production PWA domain + WordPress origin + the localhost dev origin
        # for occasional debug. Session 36 added the WordPress origin so the
        # WP-side login redirect can POST to /wp-json/jwt-auth/v1/token across
        # the subdomain boundary. The PWA at bible.remnantofpromise.org reads
        # cookies set by the WP origin via Domain=.remnantofpromise.org; CORS
        # allows credentials. The API's own origin
        # (api.bible.remnantofpromise.org) is not in this list — it's where
        # the requests originate from, not where they go.
        value: https://bible.remnantofpromise.org,https://remnantofpromise.org,http://localhost:5173
      - key: JWT_SECRET
        # Shared secret with WordPress's JWT_AUTH_SECRET_KEY in wp-config.php.
        # Set manually in the Render dashboard (Web Service → Environment).
        # sync: false tells Render to keep this out of the blueprint export so
        # the secret never appears in git. See _scratch/_session36_wp_install.md
        # for the generation + paste flow (Session 36 wheel).
        sync: false
      # ---- Session 37: Stripe + WP-side partner_tier sync ----------------
      # All five values are sync: false — set in the Render dashboard, never
      # in git. See _scratch/_session37_stripe_setup.md (steps 4 + 6) for
      # where each value comes from.
      - key: STRIPE_SECRET_KEY
        # Stripe secret API key (sk_test_... in test mode, sk_live_... in live).
        # Stripe Dashboard → Developers → API keys → Secret key (reveal).
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        # Webhook signing secret (whsec_...). Stripe Dashboard → Developers →
        # Webhooks → your endpoint → Signing secret (reveal).
        sync: false
      - key: WP_API_BASE
        # Base URL the webhook hits to push partner_tier back to WordPress.
        # e.g. https://remnantofpromise.org/wp-json
        sync: false
      - key: WP_API_USER
        # WordPress admin username for the REST API push (Application Password auth).
        sync: false
      - key: WP_API_APP_PASSWORD
        # WordPress Application Password for partner_tier sync. Generated at
        # WP admin → Users → your user → Application Passwords. WordPress shows
        # it ONCE; copy with the spaces.
        #
        # Session 42: this is now the FALLBACK transport. When
        # WP_COMPANION_SECRET (below) is set, the partner_tier sync uses
        # the HMAC path to the bible-companion plugin instead, and these
        # WP_API_USER + WP_API_APP_PASSWORD vars can be retired in a
        # follow-up session once the plugin path is live-verified.
        sync: false
      # ---- Session 42: bible-companion HMAC partner_tier sync -----------
      # Shared HMAC secret with the `bible-companion` WordPress plugin
      # (wp-companion/bible-companion/). Same string that lives in
      # wp-config.php as ROP_COMPANION_SECRET. When set, the
      # partner_tier sync POSTs an HMAC-signed request to the plugin's
      # /wp-json/rop/v1/partner-tier endpoint — which only writes the
      # one rop_partner_tier user-meta key — instead of using the
      # broad-scope Application Password path above. Generate a 64-char
      # hex string (32 bytes entropy); paste the SAME value here and in
      # wp-config.php. sync: false — set in the Render dashboard, never
      # in git.
      - key: WP_COMPANION_SECRET
        sync: false
      - key: PYTHONUNBUFFERED
        value: "1"

  # ---- Session 40: PWA Static Site ----------------------------------------
  #
  # The Vite-built React PWA at `~/Desktop/App/app/` ships here. Render's
  # static-site runtime builds the bundle (npm install + npm run build),
  # publishes `app/dist/`, and serves with a global CDN + auto-cert.
  #
  # Build-time VITE_API_BASE points the bundled JS at the API on its new
  # subdomain (Session 40 lock — api.bible.remnantofpromise.org). The
  # localhost dev path continues to override via .env.local; production
  # builds bake in this value.
  #
  # SPA-fallback rewrite (routes section below) means client-side routes
  # like /pricing, /manage, and any future deep-link path return
  # /index.html so React's pathname switch can take over. Without the
  # rewrite, a partner navigating directly to /manage gets a 404 from
  # the static server before any JS loads.
  #
  # No `region` field on this service — Render rejects region= on
  # static sites because they serve from the global CDN edge, not a
  # single region. Only Web Services (Docker / Node / etc.) and
  # Postgres carry region. Caught at Blueprint sync (Session 40 close).
  - type: web
    name: remnant-app-pwa
    runtime: static
    rootDir: .
    buildCommand: cd app && npm install && npm run build
    staticPublishPath: app/dist
    autoDeploy: true
    envVars:
      - key: VITE_API_BASE
        value: https://api.bible.remnantofpromise.org/v1
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      # Defensive baseline. Vite's bundler hashes assets so far-future
      # caching is safe on /assets/*; everything else gets short TTL so
      # voice-gated copy updates ship fast.
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /*
        name: Cache-Control
        value: public, max-age=0, must-revalidate
